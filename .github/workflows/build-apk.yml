name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Sync Android Gradle Config with Flutter SDK
        run: |
          mkdir -p /tmp/custom_android/kotlin
          mkdir -p /tmp/custom_android/res
          cp android/app/src/main/AndroidManifest.xml /tmp/custom_android/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/example/ax_app/MainActivity.kt /tmp/custom_android/kotlin/MainActivity.kt
          cp -r android/app/src/main/res/* /tmp/custom_android/res/
          rm -rf android
          flutter create --platforms=android --org com.example --project-name ax_app .
          mkdir -p android/app/src/main/kotlin/com/example/ax_app
          cp /tmp/custom_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/custom_android/kotlin/MainActivity.kt android/app/src/main/kotlin/com/example/ax_app/MainActivity.kt
          cp -r /tmp/custom_android/res/* android/app/src/main/res/

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
